name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collector:
    name: Collector (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test collector and audit engine
        run: npm run test:unit

  validate:
    name: Admission, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate MCP security gate
        run: |
          npm run audit:ci -- \
            --path ./examples/ci-safe-mcp.json \
            --output ./.ci-mcp-inventory.json \
            --sarif ./.ci-mcp-sentinel.sarif

      - name: Generate Kubernetes admission bundle
        run: |
          npm run generate:admission -- \
            --policy-file ./examples/oci-policies.json \
            --namespace mcp-sentinel-ci \
            --output ./.ci-kubernetes-admission

      - name: Validate Kubernetes admission bundle
        run: |
          npm run validate:admission -- \
            --policy-file ./examples/oci-policies.json \
            --namespace mcp-sentinel-ci \
            --bundle ./.ci-kubernetes-admission

      - name: Lint
        run: npm run lint

      - name: Test and build
        run: npm test
